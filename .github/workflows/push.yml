name: "Push Check"
on:
  push:
    branches-ignore:
      - master

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Common Setup
        uses: ./.github/actions/common-setup
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check code
        run: bun run lint
      - name: Lint code
        run: bun run lint

  vitest:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Common Setup
        uses: ./.github/actions/common-setup
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Vitest
        run: bun run test
